# Replaces Vercel: build the site image here, then tell the Hetzner box to
# pull it. The server never builds — see platform/Dockerfile for why.
#
# The trunk is `claude/hello-7o90qh` (there is no main — see CLAUDE.md).
# A push that does not reach the trunk does not reach production.
#
# `platform.env` on the server is WRITTEN BY THIS WORKFLOW on every deploy,
# from the repo's Secrets and Variables. Editing the file over SSH therefore
# does nothing lasting — the next deploy overwrites it. Change the value in
# GitHub instead, which is the point: it takes a browser and the shared
# account, not a key on one person's laptop.

name: Deploy platform

on:
  push:
    branches: [claude/hello-7o90qh]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-platform.yml"
  workflow_dispatch:

concurrency:
  group: deploy-platform
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/platform

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Fail here rather than half-way through: a blank secret would otherwise
      # be written to platform.env and take the site down with an auth error
      # that looks like an Airtable outage.
      - name: Check required secrets are set
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          # SITE_PASSWORD gol nu e o valoare implicita blanda: middleware.ts
          # dezactiveaza poarta si site-ul devine public pe internet.
          for v in AIRTABLE_API_KEY AIRTABLE_BASE_ID N8N_API_KEY AI33_API_KEY \
                   SITE_PASSWORD SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrete lipsa:$missing"
            echo "Adauga-le in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Toate secretele necesare sunt setate."

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GITHUB_TOKEN is valid for the length of this run, so the server logs in
      # with it per deploy rather than holding a long-lived PAT.
      - name: Write env, pull and restart on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          AI33_API_KEY: ${{ secrets.AI33_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          AIRTABLE_PROJECTS_TABLE: ${{ vars.AIRTABLE_PROJECTS_TABLE || 'Proiecte' }}
          AIRTABLE_SCENES_TABLE: ${{ vars.AIRTABLE_SCENES_TABLE || 'Scene' }}
          AIRTABLE_SCRIPTS_TABLE: ${{ vars.AIRTABLE_SCRIPTS_TABLE || 'Scripturi' }}
          N8N_API_URL: ${{ vars.N8N_API_URL || 'https://wf7.house-of-videos.com/api/v1' }}
          N8N_NEW_PROJECT_WEBHOOK_URL: ${{ vars.N8N_NEW_PROJECT_WEBHOOK_URL || 'https://wf7.house-of-videos.com/webhook/new-project' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: AIRTABLE_API_KEY,AIRTABLE_BASE_ID,N8N_API_KEY,AI33_API_KEY,SITE_PASSWORD,AIRTABLE_PROJECTS_TABLE,AIRTABLE_SCENES_TABLE,AIRTABLE_SCRIPTS_TABLE,N8N_API_URL,N8N_NEW_PROJECT_WEBHOOK_URL,REGISTRY_TOKEN,REGISTRY_USER
          script: |
            set -euo pipefail
            cd /opt/n8n

            # Written fresh each deploy; 077 so it lands 0600, never 0644.
            umask 077
            cat > platform.env <<ENVEOF
            # GENERAT AUTOMAT de .github/workflows/deploy-platform.yml.
            # Nu edita aici — urmatorul deploy suprascrie fisierul.
            # Schimba valoarea in GitHub: Settings -> Secrets and variables -> Actions.
            AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
            AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
            AIRTABLE_PROJECTS_TABLE=${AIRTABLE_PROJECTS_TABLE}
            AIRTABLE_SCENES_TABLE=${AIRTABLE_SCENES_TABLE}
            AIRTABLE_SCRIPTS_TABLE=${AIRTABLE_SCRIPTS_TABLE}
            N8N_API_URL=${N8N_API_URL}
            N8N_NEW_PROJECT_WEBHOOK_URL=${N8N_NEW_PROJECT_WEBHOOK_URL}
            N8N_API_KEY=${N8N_API_KEY}
            AI33_API_KEY=${AI33_API_KEY}
            SITE_PASSWORD=${SITE_PASSWORD}
            ENVEOF

            echo "${REGISTRY_TOKEN}" \
              | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
            docker compose pull web
            docker compose up -d web
            docker image prune -f

            # A deploy that reports success while the container crash-loops is
            # the failure mode this whole file exists to avoid.
            for i in $(seq 1 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' n8n-web-1 2>/dev/null || echo starting)
              [ "$s" = "healthy" ] && { echo "web: healthy"; exit 0; }
              sleep 5
            done
            echo "::error::web nu a devenit healthy in 150s"
            docker compose logs --tail 50 web
            exit 1
