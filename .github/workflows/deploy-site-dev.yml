# The scroll-hero prototype as the `site-dev` container: same recipe as
# deploy-platform.yml, smaller. Build the image here, copy the frame
# sequence to the box, tell the box to pull.
#
# Runs on trunk pushes that touch the prototype, or by hand from any branch
# (Actions -> Deploy site-dev -> Run workflow, pick the branch). The manual
# path is how a feature branch reaches site-dev without going through the
# trunk first — that is what a dev site is for.
#
# The frames go to /opt/n8n/frames on the box, which Caddy serves as
# /frames/* — they are deliberately not in the image (see the Dockerfile).

name: Deploy site-dev

on:
  push:
    branches: [claude/hello-7o90qh]
    paths:
      - "prototypes/scroll-hero/**"
      - ".github/workflows/deploy-site-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/site-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          for v in SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrete lipsa:$missing"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./prototypes/scroll-hero
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=site-dev
          cache-to: type=gha,mode=max,scope=site-dev

      # The frames live next to the compose file, not in the image. Caddy
      # mounts ./frames read-only and answers /frames/* from it.
      - name: Copy frames to Hetzner
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "prototypes/scroll-hero/public/frames/*.webp"
          target: /opt/n8n/frames
          strip_components: 4
          overwrite: true

      - name: Pull and restart on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REGISTRY_TOKEN,REGISTRY_USER
          script: |
            set -euo pipefail
            cd /opt/n8n
            echo "${REGISTRY_TOKEN}" \
              | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
            docker compose pull site-dev
            docker compose up -d site-dev
            docker image prune -f
