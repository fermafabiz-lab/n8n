# The render engine (engine/, docs/plans/engine-final-assembly.md): build its
# image here, then run it on the Hetzner box beside the site. Same shape as
# deploy-platform.yml — the server never builds.
#
# It is started with `docker run`, not as a compose service, ON PURPOSE: the
# box's docker-compose.yml is not deployed by anything (infra/README.md — the
# repo copy is a snapshot, and a guess where the two differ), so adding a
# service there would mean hand-editing the box. `docker run` needs nothing
# from that file: it joins the compose network the site is on (read off the
# running `web` container) and reads the two values it needs from the box's
# own .env.
#
# Restarting the engine mid-render is safe by design: SIGTERM makes it finish
# the poll in hand and give its lease back, and the new container resumes the
# same Railway job (engine/src/worker.ts). It still means ~90 s of silence on
# a render, so the usual rule applies: look at running renders before
# merging engine/** into the trunk.
#
# Nothing here decides WHO renders. The site does (FINAL_ASSEMBLY_ENGINE,
# lib/assembly-engine.ts); with the default `n8n` this container sits idle.

name: Deploy engine

on:
  push:
    branches: [claude/hello-7o90qh]
    paths:
      - "engine/src/**"
      - "engine/package.json"
      - "engine/package-lock.json"
      - "engine/Dockerfile"
      - ".github/workflows/deploy-engine.yml"
  workflow_dispatch:

concurrency:
  group: deploy-engine
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/engine

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are set
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_URL: ${{ vars.RENDER_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          for v in RENDER_API_KEY RENDER_URL SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc:$missing (Settings -> Secrets and variables -> Actions; RENDER_URL e Variable, restul Secrets)"
            exit 1
          fi

      # The engine's own golden tests, before anything is built: a port that
      # no longer matches n8n must not reach the box.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine checks
        working-directory: engine
        run: npm ci && npm run check

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      - name: Run on Hetzner
        uses: appleboy/ssh-action@v1
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_URL: ${{ vars.RENDER_URL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENGINE_CONCURRENCY: ${{ vars.ENGINE_CONCURRENCY || '2' }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: RENDER_API_KEY,RENDER_URL,ELEVENLABS_API_KEY,ENGINE_CONCURRENCY,IMAGE_TAG,REGISTRY_TOKEN,REGISTRY_USER
          script: |
            set -euo pipefail
            cd /opt/n8n

            # Two values from the box's own .env, read by name — never by
            # sourcing the file, which holds bcrypt hashes full of `$`.
            envval() { grep -E "^$1=" .env | tail -1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"; }
            HOV_DB_PASSWORD="$(envval HOV_DB_PASSWORD)"
            SITE_HOST="$(envval SITE_HOST)"
            [ -n "$HOV_DB_PASSWORD" ] || { echo "::error::HOV_DB_PASSWORD not found in /opt/n8n/.env"; exit 1; }
            [ -n "$SITE_HOST" ] || { echo "::error::SITE_HOST not found in /opt/n8n/.env"; exit 1; }

            # The network the site is on, so `postgres` and `n8n` resolve.
            NET="$(docker inspect n8n-web-1 -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')"
            [ -n "$NET" ] || { echo "::error::could not read the web container's network"; exit 1; }

            echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
            docker pull "$IMAGE_TAG"

            # Graceful: the worker gives its leases back on SIGTERM.
            docker stop -t 90 hov-engine >/dev/null 2>&1 || true
            docker rm hov-engine >/dev/null 2>&1 || true

            umask 077
            ENVFILE="$(mktemp)"
            cat > "$ENVFILE" <<ENVEOF
            DATABASE_URL=postgresql://hov:${HOV_DB_PASSWORD}@postgres:5432/hov
            RENDER_URL=${RENDER_URL}
            RENDER_API_KEY=${RENDER_API_KEY}
            MEDIA_ROOT=/media
            MEDIA_BASE_URL=https://${SITE_HOST}/media
            N8N_WEBHOOK_BASE=http://n8n:5678/webhook
            CONCURRENCY=${ENGINE_CONCURRENCY}
            WORKER_ID=hov-engine
            ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
            ENVEOF
            sed -i 's/^[[:space:]]*//' "$ENVFILE"

            docker run -d --name hov-engine \
              --restart unless-stopped \
              --network "$NET" \
              --group-add 2000 \
              --stop-timeout 90 \
              -v /opt/n8n/media:/media \
              --env-file "$ENVFILE" \
              --log-opt max-size=20m --log-opt max-file=3 \
              "$IMAGE_TAG"
            rm -f "$ENVFILE"
            docker image prune -f

            # Up = still running after 15 s AND said so. A missing db/016 or a
            # bad DATABASE_URL exits at boot, which shows here.
            sleep 15
            state="$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' hov-engine)"
            echo "hov-engine: $state"
            docker logs --tail 20 hov-engine
            case "$state" in
              "running restarts=0") docker logs hov-engine 2>&1 | grep -q '"engine worker up"' && exit 0 ;;
            esac
            echo "::error::hov-engine did not come up"
            exit 1
